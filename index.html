<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>打刻</title>
<style>
  :root {
    --bg: #f5f6f4;
    --panel: #ffffff;
    --ink: #1f2a24;
    --muted: #5d6b63;
    --line: #d5dad6;
    --in: #1f6f4a;
    --out: #9a4a1c;
    --ng: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px 16px 48px;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    line-height: 1.7;
  }
  main { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 1.25rem; margin: 0 0 16px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin-top: 12px; }
  label:first-of-type { margin-top: 0; }
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 12px;
    font-size: 1.1rem;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
  }
  .remember { display: flex; align-items: flex-start; gap: 8px; margin-top: 14px; font-size: 0.85rem; color: var(--muted); }
  .remember input { margin-top: 6px; }
  input:focus-visible, button:focus-visible { outline: 3px solid #7fb69a; outline-offset: 2px; }
  .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button {
    padding: 28px 8px;
    font-size: 1.3rem;
    font-weight: 700;
    color: #fff;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
  }
  button.in { background: var(--in); }
  button.out { background: var(--out); }
  button.retry {
    background: #fff;
    color: var(--ink);
    border: 1px solid var(--line);
    padding: 10px 14px;
    font-size: 1rem;
    font-weight: 400;
    margin-top: 12px;
  }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  #status { min-height: 1.5em; font-weight: 700; margin: 0 0 8px; font-size: 1.05rem; }
  #status.ok { color: var(--in); }
  #status.ng { color: var(--ng); }
  #detail { margin: 0; font-size: 0.9rem; white-space: pre-wrap; word-break: break-all; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>打刻</h1>

  <section class="panel">
    <label for="empId">社員ID</label>
    <input id="empId" type="text" inputmode="numeric" autocomplete="off" placeholder="例：115">

    <label for="pin">PIN</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PINを入力">

    <label class="remember">
      <input id="remember" type="checkbox">
      <span>この端末に社員IDとPINを記憶する（自分専用のスマホ・パソコンだけで使ってください）</span>
    </label>
  </section>

  <section class="panel">
    <div class="buttons">
      <button id="btnIn" class="in" type="button">出勤</button>
      <button id="btnOut" class="out" type="button">退勤</button>
    </div>
  </section>

  <section class="panel" aria-live="polite">
    <p id="status"></p>
    <p id="detail"></p>
    <button id="btnRetry" class="retry" type="button" hidden>同じ時刻でもう一度送る</button>
  </section>
</main>

<script>
(function () {
  // 打刻を受け付けるWorkerのURL
  var API_URL = 'https://punch-api.beambox0052.workers.dev/punch';

  var empIdEl = document.getElementById('empId');
  var pinEl = document.getElementById('pin');
  var rememberEl = document.getElementById('remember');
  var btnIn = document.getElementById('btnIn');
  var btnOut = document.getElementById('btnOut');
  var btnRetry = document.getElementById('btnRetry');
  var statusEl = document.getElementById('status');
  var detailEl = document.getElementById('detail');

  // 送信に失敗したときのために、押した時刻を保持する
  var pending = null;

  function pad(n) { return String(n).padStart(2, '0'); }

  function toIsoLocal(d) {
    var off = -d.getTimezoneOffset();
    var sign = off >= 0 ? '+' : '-';
    var a = Math.abs(off);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
      'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) +
      sign + pad(Math.floor(a / 60)) + ':' + pad(a % 60);
  }

  function showStatus(text, cls, detail) {
    statusEl.textContent = text;
    statusEl.className = cls || '';
    detailEl.textContent = detail || '';
  }

  function setBusy(busy) {
    btnIn.disabled = busy;
    btnOut.disabled = busy;
    btnRetry.disabled = busy;
  }

  function saveRemember() {
    try {
      if (rememberEl.checked) {
        localStorage.setItem('punch_empId', empIdEl.value.trim());
        localStorage.setItem('punch_pin', pinEl.value);
        localStorage.setItem('punch_remember', '1');
      } else {
        localStorage.removeItem('punch_empId');
        localStorage.removeItem('punch_pin');
        localStorage.removeItem('punch_remember');
      }
    } catch (e) { /* 記憶できなくても打刻は続けられる */ }
  }

  function loadRemember() {
    try {
      if (localStorage.getItem('punch_remember') === '1') {
        rememberEl.checked = true;
        empIdEl.value = localStorage.getItem('punch_empId') || '';
        pinEl.value = localStorage.getItem('punch_pin') || '';
      }
    } catch (e) { /* 何もしない */ }
  }

  async function send(kind, pressedIso) {
    var empId = empIdEl.value.trim();
    var pin = pinEl.value;

    if (!empId || !pin) {
      showStatus('社員IDとPINを入力してください。', 'ng', '');
      return;
    }

    saveRemember();
    setBusy(true);
    btnRetry.hidden = true;
    showStatus(kind + 'を送信中です…', '', '押した時刻：' + pressedIso);

    try {
      var res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ empId: empId, pin: pin, kind: kind, pressedAt: pressedIso })
      });
      var data = await res.json().catch(function () { return {}; });

      if (res.ok && data.ok) {
        pending = null;
        var lines = ['打刻時刻：' + data.time];
        if (data.note) { lines.push('備考：' + data.note); }
        showStatus(data.name + 'さんの' + data.kind + 'を登録しました。', 'ok', lines.join('\n'));
      } else if (data && data.code === 'duplicate') {
        pending = null;
        showStatus('この打刻はすでに登録されています。', 'ok', '押した時刻：' + pressedIso);
      } else if (data && data.code === 'auth_failed') {
        // PINを直せば、押した時刻のまま送り直せる（30分以内）
        pending = { kind: kind, pressedIso: pressedIso };
        btnRetry.hidden = false;
        showStatus('社員IDまたはPINが違います。', 'ng',
          '入力を直してから「同じ時刻でもう一度送る」を押してください。\n押した時刻：' + pressedIso);
      } else if (data && data.code === 'locked') {
        pending = { kind: kind, pressedIso: pressedIso };
        btnRetry.hidden = false;
        showStatus('いまは打刻できません。', 'ng',
          (data.message || '') + '\n押した時刻：' + pressedIso + '\n' +
          '時間をおいて、PINを確認してから「同じ時刻でもう一度送る」を押してください。\n' +
          '（押してから30分以上たつと、送信した時刻が採用されます）');
      } else {
        // サーバー側の問題：同じ時刻で再送できるようにする
        pending = { kind: kind, pressedIso: pressedIso };
        btnRetry.hidden = false;
        showStatus('登録できませんでした。', 'ng',
          (data.message || '原因を取得できませんでした。') + '\n' +
          (data.detail ? '内容：' + data.detail + '\n' : '') +
          '押した時刻：' + pressedIso + '\n' +
          '少し待ってから「同じ時刻でもう一度送る」を押してください。');
      }
    } catch (e) {
      pending = { kind: kind, pressedIso: pressedIso };
      btnRetry.hidden = false;
      showStatus('通信できませんでした。', 'ng',
        '電波の状態を確認してください。\n押した時刻：' + pressedIso + '\n' +
        '通信が戻ったら「同じ時刻でもう一度送る」を押してください。');
    } finally {
      setBusy(false);
    }
  }

  function punch(kind) {
    // 最初にボタンを押した時刻を確定する（ログインや通信に時間がかかっても変わらない）
    var pressedIso = toIsoLocal(new Date());
    send(kind, pressedIso);
  }

  btnIn.addEventListener('click', function () { punch('出勤'); });
  btnOut.addEventListener('click', function () { punch('退勤'); });
  btnRetry.addEventListener('click', function () {
    if (pending) { send(pending.kind, pending.pressedIso); }
  });

  loadRemember();
})();
</script>
</body>
</html>
